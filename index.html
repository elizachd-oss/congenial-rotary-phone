<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>תאילנד 2026 — מלווה הטיול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#17302c; --ink2:#5b6b68; --line:#e4dfd3;
  --jade:#0f6b5c; --jade-soft:#dcefe9; --gold:#c9932a; --gold-soft:#fbefd3;
  --red:#b8432f; --red-soft:#f9e1dc; --tab:#ffffffee; --shadow:0 1px 2px rgba(23,48,44,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10201d; --card:#182c28; --ink:#eef3f0; --ink2:#9fb3ae; --line:#27403a;
  --jade:#4fc4a8; --jade-soft:#173d35; --gold:#e5b658; --gold-soft:#3d3115;
  --red:#ef8a76; --red-soft:#4a2620; --tab:#182c28ee; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#10201d; --card:#182c28; --ink:#eef3f0; --ink2:#9fb3ae; --line:#27403a;
  --jade:#4fc4a8; --jade-soft:#173d35; --gold:#e5b658; --gold-soft:#3d3115;
  --red:#ef8a76; --red-soft:#4a2620; --tab:#182c28ee; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:var(--bg);position:sticky;top:0;z-index:5}
header h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--ink2);font-size:13px}
main{padding:4px 14px 20px;max-width:640px;margin:0 auto}
section{display:none}section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700;margin:0 0 6px}
.card h3{font-size:15px;font-weight:700;margin:12px 0 4px;color:var(--jade)}
.muted{color:var(--ink2);font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--jade-soft);color:var(--jade);margin-inline-start:6px;vertical-align:middle}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.red{background:var(--red-soft);color:var(--red)}
.hero{background:var(--jade);color:#fff;border:none;border-radius:18px;padding:18px 18px 16px}
.hero .big{font-size:34px;font-weight:900;line-height:1.1}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .day{font-size:18px;font-weight:700;margin-top:10px}
.toggle{display:flex;gap:8px;margin:12px 0 4px}
.toggle button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px}
.toggle button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t{color:var(--jade);font-weight:700}
.act p{margin:6px 0}
.dayrow{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:last-child{border-bottom:none}
.dayrow .date{min-width:50px;text-align:center;background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:6px 4px;font-weight:900;font-size:18px;line-height:1}
.dayrow .date small{display:block;font-size:11px;font-weight:500;margin-top:3px}
.dayrow .date.past{background:var(--line);color:var(--ink2)}
.dayrow .date.today{background:var(--jade);color:#fff}
.dayrow .body{flex:1}
.dayrow .dest{font-weight:700;font-size:16px}
.dayrow .hotel{color:var(--ink2);font-size:13.5px}
.dayrow .detail{display:none;margin-top:8px;font-size:14.5px}
.dayrow.open .detail{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:500;font-size:12.5px}
.scroll{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.filters button.on{background:var(--jade);color:#fff;border-color:var(--jade)}
.rec{padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:none}
.rec .name{font-weight:700}
.rec .desc{font-size:14px;margin:3px 0}
.rec .price{font-size:13px;color:var(--gold);font-weight:500}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
label.chk:last-child{border:none}
label.chk input{width:22px;height:22px;accent-color:var(--jade);margin-top:2px;flex-shrink:0}
label.chk.done span.txt{text-decoration:line-through;color:var(--ink2)}
label.chk .own{color:var(--ink2);font-size:12.5px;display:block}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--tab);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:none;background:none;color:var(--ink2);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--jade);font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.u{align-self:flex-start;background:var(--jade);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.ask{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:10px 0}
.ask input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.ask button{padding:0 18px;border-radius:14px;border:none;background:var(--jade);color:#fff;font:inherit;font-weight:700;font-size:15px}
.ask button:disabled{opacity:.5}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sugg button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0}
.small{font-size:13px}
a{color:var(--jade)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate h2{font-size:22px;margin:0 0 6px}.gate p{color:var(--ink2);margin:0 0 18px}
.gate input{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;width:200px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);direction:ltr}
.gate button{margin-top:14px;padding:12px 32px;border-radius:14px;border:none;background:var(--jade);color:#fff;font:inherit;font-weight:700;font-size:16px}
.gate .err{color:var(--red);min-height:22px;margin-top:8px}
.key{display:flex;gap:8px;margin-top:8px}.key input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;direction:ltr}
.key button{padding:0 14px;border-radius:10px;border:none;background:var(--jade);color:#fff;font:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="gate" id="gate"><div style="font-size:48px">🐘</div><h2>תאילנד 2026</h2><p>הזינו קוד כניסה</p><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off"><button id="pinbtn">כניסה</button><div class="err" id="pinerr"></div></div>
<header><h1 id="hdr">תאילנד 2026 — מלווה הטיול</h1><p id="hdrsub"></p></header>
<main>
<section id="s-today" class="active"></section>
<section id="s-days"><div class="card" id="dayslist"></div></section>
<section id="s-flights"></section>
<section id="s-food"></section>
<section id="s-tasks"></section>
<section id="s-ai">
  <div class="card"><h2>שאלו על הטיול</h2><p class="muted small">התשובות מבוססות על טבלת התכנון בלבד. ה-AI מציין כשמשהו לא מופיע בתכנון.</p>
  <div class="sugg" id="sugg"></div><div id="aikey" style="display:none"><p class="small muted" style="margin:10px 0 0">בגרסה הזו ה-AI עובד עם מפתח API של Anthropic (נשמר במכשיר הזה בלבד):</p><div class="key"><input id="keyin" placeholder="sk-ant-..." type="password"><button id="keybtn">שמור</button></div></div></div>
  <div class="chat" id="chat"></div>
  <div class="ask"><input id="q" placeholder="למשל: איפה תמר אוכלת בפאי?" enterkeyhint="send"><button id="send">שלח</button></div>
</section>
</main>
<nav>
  <button data-s="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>עכשיו</button>

  <button data-s="flights"><svg viewBox="0 0 24 24"><path d="M2 16l20-6-8 8-3-4-9 2zM14 18l-2-3"/></svg>טיסות</button>

  <button data-s="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>שאל AI</button>
</nav>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>esc(s).replace(/(\b\d{1,2}:\d{2}(?:-\d{1,2}:\d{2})?)/g,'<span class="t">$1</span>');
const store={get(k,d){try{const v=localStorage.getItem('th26:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('th26:'+k,JSON.stringify(v))}catch(e){}}};
const dayName=d=>['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][new Date(d+'T00:00').getDay()];
const fmt=d=>{const [y,m,dd]=d.split('-');return `${+dd}.${+m}`};
function todayISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const idx=Object.fromEntries(D.days.map((d,i)=>[d.date,i]));

/* ---------- now ---------- */
let showTomorrow=false;
function renderToday(){
  const s=$('#s-today'),t=todayISO(),first=D.days[0].date,last=D.days[D.days.length-1].date;
  let html='';
  if(t<first){
    const n=Math.round((new Date(first)-new Date(t))/864e5);
    html+=`<div class="card hero"><div class="sub">ספירה לאחור</div><div class="big">${n} ימים</div><div class="sub">עד הטיסה ב-${fmt(first)}, ${dayName(first)}, 05:15 מנתב"ג</div></div>`;
    const open=D.tasks.filter(x=>x.status!=='בוצע');
    const done=store.get('tasks',{});
    const remaining=open.filter(x=>!done[x.task]);
    html+=`<div class="card"><h2>נשאר לסגור לפני הטיסה <span class="chip gold">${remaining.length}</span></h2>${remaining.slice(0,8).map(x=>`<p style="margin:4px 0">• ${esc(x.task)} <span class="muted small">(${esc(x.owner)})</span></p>`).join('')||'<p class="muted">הכל סגור 🎉</p>'}</div>`;
    html+=dayCard(D.days[0],'היום הראשון');
  } else if(t>last){
    html+=`<div class="card hero"><div class="big">חזרנו הביתה</div><div class="sub">הטיול הסתיים ב-${fmt(last)}. כל התכנון עדיין כאן למזכרת.</div></div>`;
  } else {
    const cur=D.days[idx[t]],nxt=D.days[idx[addDays(t,1)]];
    html+=`<div class="toggle"><button id="bT" class="${showTomorrow?'':'on'}">היום · ${fmt(t)}</button><button id="bN" class="${showTomorrow?'on':''}">מחר · ${fmt(addDays(t,1))}</button></div>`;
    const d=showTomorrow?nxt:cur;
    html+= d?dayCard(d,showTomorrow?'מחר':'היום',true):`<div class="card muted">אין תכנון ליום הזה</div>`;
  }
  html+=`<div class="card"><h2>פרטים חשובים</h2><p class="small">קוד הזמנה <b class="mono">${esc(D.meta.pnr)}</b> · ${esc(D.meta.airlines)} · ${D.meta.pax} נוסעים</p><p class="small muted">${esc(D.meta.baggage)}</p><p class="small">רגישות: <b>תמר — צליאק (ללא גלוטן)</b>. לשאת תמיד: כרטיס הסבר בתאילנדית + בקבוק Tamari.</p></div>`;
  s.innerHTML=html;
  const bT=$('#bT'),bN=$('#bN');
  if(bT){bT.onclick=()=>{showTomorrow=false;renderToday()};bN.onclick=()=>{showTomorrow=true;renderToday()}}
}
function dayCard(d,label,hero){
  const chip=d.status==='הוזמן'?'<span class="chip">הוזמן</span>':`<span class="chip red">${esc(d.status)}</span>`;
  return `<div class="card ${hero?'hero':''}">
   <div class="${hero?'sub':'muted small'}">${label} · יום ${esc(d.weekday)}, ${fmt(d.date)}</div>
   <div class="${hero?'big':''}" style="${hero?'':'font-size:22px;font-weight:900'}">${esc(d.dest)}</div>
   <div class="${hero?'day':''}">🛏 ${esc(d.hotel)}</div></div>
   <div class="card act"><h3>מה עושים</h3><p>${hl(d.activities)}</p>
   <h3>לוגיסטיקה</h3><p>${hl(d.logistics)}</p>
   ${d.notes?`<h3>שימו לב</h3><p>${hl(d.notes)}</p>`:''}
   <p class="small muted">${chip} ${d.cost?`· עלות מוערכת <b class="mono">${d.cost.toLocaleString()}</b> ฿`:''}</p></div>`;
}

/* ---------- days ---------- */
function renderDays(){
  const t=todayISO();
  $('#dayslist').innerHTML=`<h2>${D.days.length} ימים · ${fmt(D.days[0].date)} עד ${fmt(D.days.at(-1).date)}</h2>`+D.days.map((d,i)=>`
   <div class="dayrow ${d.date===t?'open':''}" data-i="${i}">
    <div class="date ${d.date<t?'past':d.date===t?'today':''}">${+d.date.slice(8)}<small>${esc(d.weekday)}</small></div>
    <div class="body"><div class="dest">${esc(d.dest)} ${d.status!=='הוזמן'?`<span class="chip red">${esc(d.status)}</span>`:''}</div>
     <div class="hotel">🛏 ${esc(d.hotel)}</div>
     <div class="detail"><p><b>מה עושים:</b> ${hl(d.activities)}</p><p><b>לוגיסטיקה:</b> ${hl(d.logistics)}</p>${d.notes?`<p><b>שימו לב:</b> ${hl(d.notes)}</p>`:''}${d.cost?`<p class="muted small">עלות מוערכת <span class="mono">${d.cost.toLocaleString()}</span> ฿</p>`:''}</div>
    </div></div>`).join('');
  document.querySelectorAll('.dayrow').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
}

/* ---------- flights ---------- */
function renderFlights(){
  $('#s-flights').innerHTML=`
  <div class="card hero"><div class="sub">קוד הזמנה (PNR)</div><div class="big mono">${esc(D.meta.pnr)}</div><div class="sub">${esc(D.meta.airlines)} · ${esc(D.meta.baggage)}</div></div>
  <div class="card"><h2>לוח טיסות</h2>${D.flights.map(f=>f.code.startsWith('-')?`<div class="rec muted small">⏱ קונקשן ${esc(f.airline)} — ${esc(f.duration)}</div>`:`<div class="rec"><div class="name"><span class="mono">${esc(f.code)}</span> · ${esc(f.airline)}</div><div class="desc">${esc(f.origin)} <span class="mono">${esc(f.dep)}</span> ← ${esc(f.dest)} <span class="mono">${esc(f.arr)}</span></div><div class="muted small">${esc(f.duration)}</div></div>`).join('')}</div>
  <div class="card"><h2>נוסעים · TG 110 (בנגקוק–צ'יאנג מאי)</h2><div class="scroll"><table><tr><th>שם</th><th>מושב</th><th>ארוחה</th><th>כרטיס</th></tr>${D.pax.map(p=>`<tr><td>${esc(p.name)}</td><td class="mono">${esc(p.seat)}</td><td>${esc(p.meal)}<br><span class="muted small">${esc(p.mealStatus)}</span></td><td class="mono small">${esc(p.ticket)}</td></tr>`).join('')}</table></div></div>
  <div class="notice">⚠️ טיסות הפנים צ'יאנג מאי→קוסמוי (19.9) וקוסמוי→בנגקוק (26.9) מסומנות בטבלה כ"טרם התחיל" — לוודא שהוזמנו.</div>
  <div class="notice">בטיסת החזור (28.9) להגיע לסוברנבהומי כ-3.5 שעות לפני ההמראה.</div>`;
}

/* ---------- food ---------- */
let area='הכל';
function renderFood(){
  const areas=['הכל',...new Set([...D.gf,...D.recs].map(x=>x.area))];
  const gf=D.gf.filter(x=>area==='הכל'||x.area===area), rc=D.recs.filter(x=>area==='הכל'||x.area===area);
  $('#s-food').innerHTML=`<div class="filters">${areas.map(a=>`<button class="${a===area?'on':''}" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div>
  <div class="card"><h2>ללא גלוטן — לתמר 🌾🚫</h2>${gf.map(x=>`<div class="rec"><div class="name">${esc(x.name)} <span class="chip">${esc(x.cat)}</span></div><div class="desc">${esc(x.desc)}</div><div class="price">${esc(x.price)}</div></div>`).join('')||'<p class="muted">אין פריטים באזור זה</p>'}</div>
  <div class="card"><h2>לינה ואטרקציות</h2>${rc.map(x=>`<div class="rec"><div class="name">${esc(x.name)} <span class="chip gold">${esc(x.cat)}</span></div><div class="desc">${esc(x.desc)}</div><div class="price">${esc(x.price)}</div></div>`).join('')}</div>`;
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{area=b.dataset.a;renderFood();window.scrollTo(0,0)});
}

/* ---------- tasks ---------- */
function renderTasks(){
  const dt=store.get('tasks',{}),dp=store.get('pack',{});
  const tdone=D.tasks.filter(x=>x.status==='בוצע'||dt[x.task]).length, pdone=D.pack.filter(x=>dp[x.item]).length;
  const cats=[...new Set(D.pack.map(x=>x.cat))];
  $('#s-tasks').innerHTML=`
  <div class="card"><h2>משימות לפני הטיסה <span class="chip">${tdone}/${D.tasks.length}</span></h2><div class="prog"><i style="width:${100*tdone/D.tasks.length}%"></i></div>
   ${D.tasks.map(x=>{const on=x.status==='בוצע'||!!dt[x.task];return `<label class="chk ${on?'done':''}"><input type="checkbox" data-k="t" data-id="${esc(x.task)}" ${on?'checked':''}><span><span class="txt">${esc(x.task)}</span><span class="own">${esc(x.owner)}${x.status&&x.status!=='בוצע'?' · '+esc(x.status):''}</span></span></label>`}).join('')}</div>
  <div class="card"><h2>רשימת אריזה <span class="chip">${pdone}/${D.pack.length}</span></h2><div class="prog"><i style="width:${100*pdone/D.pack.length}%"></i></div>
   ${cats.map(c=>`<h3>${esc(c)}</h3>`+D.pack.filter(x=>x.cat===c).map(x=>`<label class="chk ${dp[x.item]?'done':''}"><input type="checkbox" data-k="p" data-id="${esc(x.item)}" ${dp[x.item]?'checked':''}><span class="txt">${esc(x.item)}</span></label>`).join('')).join('')}</div>
  <p class="muted small" style="text-align:center">הסימונים נשמרים במכשיר הזה בלבד.</p>`;
  document.querySelectorAll('#s-tasks input').forEach(i=>i.onchange=()=>{const k=i.dataset.k==='t'?'tasks':'pack';const o=store.get(k,{});o[i.dataset.id]=i.checked;store.set(k,o);renderTasks();if(k==='tasks')renderToday()});
}

/* ---------- AI ---------- */
let sample=null,history=[];
const SUGG=['מה קורה מחר?','איפה תמר יכולה לאכול בצ\'יאנג מאי?','מה השעה של הטיסה חזרה?','מה לוקחים לפאי ומה משאירים?','מה מספר המושב של חוה?','מה ההוצאות המוערכות בקוסמוי?'];
function ctx(){return `אתה עוזר טיול משפחתי לתאילנד (10–29.9.2026), משפחת דמבינסקי + יוסף. ענה בעברית, קצר וברור, על סמך הנתונים בלבד. אם המידע לא בנתונים — אמור זאת במפורש ואל תמציא. היום: ${todayISO()}. תמר צליאקית — כל המלצת אוכל עבורה חייבת להיות ללא גלוטן ומהרשימה.\n\nנתוני הטיול (JSON):\n${JSON.stringify(D)}`}
function addMsg(t,cls){const m=document.createElement('div');m.className='msg '+cls;m.textContent=t;$('#chat').appendChild(m);m.scrollIntoView({block:'end'});return m}
async function ask(q){
  if(!q.trim())return;
  $('#q').value='';addMsg(q,'u');
  if(!sample||(sample===direct&&!store.get('apikey',''))){addMsg('כדי לשאול, שמרו קודם מפתח API בשדה למעלה.','a');return}
  const m=addMsg('חושב…','a');$('#send').disabled=true;
  const turns=[{role:'user',content:ctx()},{role:'assistant',content:'מובן. אשיב על סמך נתוני הטיול בלבד.'},...history,{role:'user',content:q}];
  try{
    const r=await sample(turns,{cache:false,onText:({text})=>{m.textContent=text;m.scrollIntoView({block:'end'})}});
    m.textContent=r.text;history.push({role:'user',content:q},{role:'assistant',content:r.text});history=history.slice(-10);
  }catch(e){m.textContent=e&&e.text?e.text:'לא הצלחתי לענות ('+(e&&e.code||'שגיאה')+'). נסו שוב.'}
  $('#send').disabled=false;
}
$('#sugg').innerHTML=SUGG.map(s=>`<button>${esc(s)}</button>`).join('');
document.querySelectorAll('#sugg button').forEach(b=>b.onclick=()=>{show('ai');ask(b.textContent)});
$('#send').onclick=()=>ask($('#q').value);$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')ask($('#q').value)});
async function direct(turns,opts){
  const key=store.get('apikey','');if(!key)throw{code:'no_key'};
  const sys=turns[0].content, msgs=turns.slice(2);
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,system:sys,messages:msgs})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw{code:r.status,text:'שגיאה מה-API: '+(e.error&&e.error.message||r.status)}}
  const j=await r.json();return{text:j.content.map(c=>c.text||'').join('')};
}
(async()=>{try{if(window.claude&&window.claude.use){sample=await claude.use('sample')}}catch(e){sample=null}
  if(!sample){sample=direct;$('#aikey').style.display='block';$('#keyin').value=store.get('apikey','')?'••••••••':'';
    $('#keybtn').onclick=()=>{const v=$('#keyin').value.trim();if(v&&!v.startsWith('•')){store.set('apikey',v);$('#keyin').value='••••••••';addMsg('המפתח נשמר. אפשר לשאול.','a')}}}
})();

/* ---------- PIN ---------- */
const PIN='2609'; // קוד הכניסה — לשינוי כאן
(function(){const g=$('#gate');if(store.get('unlocked')===PIN){g.remove();return}
 const go=()=>{if($('#pin').value===PIN){store.set('unlocked',PIN);g.remove()}else{$('#pinerr').textContent='קוד שגוי';$('#pin').value=''}};
 $('#pinbtn').onclick=go;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});})();

/* ---------- nav ---------- */
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='s-'+id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));
$('#hdrsub').textContent=`${fmt(D.days[0].date)} עד ${fmt(D.days.at(-1).date)} · ${D.meta.airlines} · PNR ${D.meta.pnr}`;
renderToday();renderDays();renderFlights();renderFood();renderTasks();
